worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # This local proxy is the first edge: never append browser-controlled IPs.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Trotot-Edge-IP $remote_addr;
    proxy_set_header X-Trotot-Proxy-Signature '';
    proxy_set_header X-Trotot-Proxy-Timestamp '';
    proxy_set_header X-Trotot-Client-IP '';
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    location /socket.io/ {
      proxy_read_timeout 75s;
      proxy_pass http://api:5000;
    }
    location /api/v1/ { proxy_pass http://api:5000; }
    location /api/docs { proxy_pass http://api:5000; }
    location / { proxy_pass http://web:3000; }
  }
}
